<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>3D 水珠 · 启动图标预览</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(130% 120% at 50% -10%, #EAF7FF 0%, #CFEFFF 45%, #A9DEFF 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #1B5E8C;
    user-select: none;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 280px; height: 340px;
    display: flex; align-items: center; justify-content: center;
  }
  /* 接地阴影：随浮动缩放 + 淡入淡出 */
  .shadow {
    position: absolute; bottom: 34px;
    width: 150px; height: 24px; border-radius: 50%;
    background: rgba(30, 120, 200, 0.30);
    filter: blur(6px);
    animation: shadow 3.6s ease-in-out infinite;
  }
  /* 浮动 + 轻微摇摆 + 呼吸挤压 */
  .pet {
    position: relative;
    width: 220px; height: 220px;
    animation: float 3.6s ease-in-out infinite;
    transform-origin: center bottom;
  }
  .pet img {
    width: 100%; height: 100%;
    display: block;
    filter: drop-shadow(0 14px 16px rgba(20, 110, 180, 0.28));
    animation: breathe 3.6s ease-in-out infinite;
  }
  /* 水面反光：缓慢扫过的高光 */
  .pet::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.85), rgba(255,255,255,0) 38%);
    mix-blend-mode: screen;
    opacity: 0.0;
    animation: shimmer 3.6s ease-in-out infinite;
    pointer-events: none;
  }
  /* 眨眼：上眼睑自上而下盖下 */
  .blink {
    position: absolute;
    top: 33%; left: 25%;
    width: 50%; height: 12%;
    background: linear-gradient(180deg, #8FD0F2 0%, #5BA9E0 100%);
    border-radius: 50%;
    transform: scaleY(0);
    transform-origin: top center;
    opacity: 0.95;
    animation: blink 5.2s infinite;
    pointer-events: none;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0)    rotate(-2.5deg); }
    50%      { transform: translateY(-26px) rotate(2.5deg); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(1.04, 0.96); }
  }
  @keyframes shadow {
    0%, 100% { transform: scale(1);    opacity: 0.32; }
    50%      { transform: scale(0.66); opacity: 0.16; }
  }
  @keyframes shimmer {
    0%, 100% { opacity: 0.0; transform: translate(0, 0); }
    45%      { opacity: 0.0; }
    60%      { opacity: 0.9; }
    75%      { opacity: 0.0; transform: translate(18px, -8px); }
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(0); }
    93%           { transform: scaleY(1); }
    96%           { transform: scaleY(0); }
  }
  /* 悬停：害羞地加速浮动 + 立刻眨一下 */
  .stage:hover .pet { animation-duration: 1.9s; }
  .stage:hover .pet img { animation-duration: 1.9s; }
  .caption { margin-top: 26px; text-align: center; }
  .caption h1 { font-size: 22px; letter-spacing: 4px; }
  .caption p  { margin-top: 8px; font-size: 13px; opacity: 0.72; }
  .badge {
    margin-top: 16px; font-size: 12px; padding: 7px 16px;
    border-radius: 999px; background: rgba(255, 255, 255, 0.6);
    color: #2E7FB8; box-shadow: 0 2px 8px rgba(40, 120, 190, 0.12);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="shadow"></div>
    <div class="pet">
      <img src="waterdrop_doll_transparent.png" alt="3D 水滴宠物" />
    </div>
  </div>
  <div class="caption">
    <h1>欢迎来到宠物聊天世界</h1>
    <p>宠物聊天 · 你的桌面伙伴</p>
    <div class="badge">单文件 HTML 动态预览 · 已同步为 App 启动闪屏</div>
  </div>
</body>
</html>
