# 指定 Gradle 使用的 JDK。Android Studio 自带 JBR 为 JDK 25，
# 而 AGP 8.5 / Kotlin 1.9.24 不支持 JDK 25（会报 JavaVersion 解析失败）。
# 这里固定使用本机已下载的 Temurin JDK 21，确保命令行与 AS 都能编译。
# 若换机器或想用其它 JDK，请改此路径，或在 AS 的
# Settings > Build > Gradle > Gradle JDK 里手动选择 JDK 21。
org.gradle.java.home=D:/Android/downloads/jdk21/jdk-21.0.12.1+1
